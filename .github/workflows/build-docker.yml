name: Build and Push OpenClaw Docker Images

on:
  push:
    branches:
      - openclaw
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SANDBOX_IMAGE: ghcr.io/hoanganhduc/openclaw-sandbox:latest

jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OpenClaw sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.SANDBOX_IMAGE }}